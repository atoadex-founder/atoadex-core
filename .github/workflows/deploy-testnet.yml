name: Test & Deploy AtoaDEX to Sui Testnet
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: mysten/sui-tools:testnet
    steps:
      - uses: actions/checkout@v4
      - name: Run Security Exploit Tests
        run: sui move test
      - name: Publish to Sui Testnet
        env:
          SUI_KEY: ${{ secrets.SUI_TESTNET_KEY }}
        run: |
          sui client new-env --alias testnet --rpc https://sui.io || true
          sui client switch --env testnet
          sui keytool import "$SUI_KEY" ed25519
          sui client faucet || true
          sleep 5
          sui client publish --gas-budget 100000000 --skip-dependency-verification
