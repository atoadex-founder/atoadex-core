name: Test & Deploy AtoaDEX to Sui Testnet
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Latest Sui Testnet CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL=$(gh release list -R MystenLabs/sui --limit 20 | awk '/testnet/ {print $1; exit}')
          gh release download "$URL" -R MystenLabs/sui -p '*ubuntu-x86_64.tgz' -O sui.tgz
          tar -xzf sui.tgz
          sudo mv sui /usr/local/bin/
      - name: Run Security Exploit Tests
        run: sui move test
      - name: Publish to Sui Testnet
        env:
          SUI_KEY: ${{ secrets.SUI_TESTNET_KEY }}
        run: |
          sui client new-env --alias testnet --rpc https://sui.io || true
          sui client switch --env testnet
          sui keytool import "$SUI_KEY" ed25519 || true
          sui client faucet || true
          sleep 5
          sui client faucet || true
          sleep 5
          sui client publish --gas-budget 200000000 --skip-dependency-verification
          
