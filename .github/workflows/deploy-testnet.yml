name: Test & Deploy AtoaDEX to Sui Testnet
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Sui CLI
        run: |
          TAG=$(curl -s https://github.com | grep -o '"tag_name": "testnet-[^"]*"' | head -n 1 | cut -d'"' -f4)
          curl -fsSL "https://github.com{TAG}/sui-${TAG}-ubuntu-x86_64.tgz" -o sui.tgz
          tar -xzf sui.tgz
          sudo mv sui /usr/local/bin/
      - name: Run Security Exploit Tests
        run: sui move test
      - name: Publish to Sui Testnet
        env:
          SUI_KEY: ${{ secrets.SUI_TESTNET_KEY }}
        run: |
          sui client new-env --alias testnet --rpc https://sui.io
          sui client switch --env testnet
          sui keytool import "$SUI_KEY" ed25519
          sui client faucet || true
          sleep 5
          sui client publish --gas-budget 100000000 --skip-dependency-verification
